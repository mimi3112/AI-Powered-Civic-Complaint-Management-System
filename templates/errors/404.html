{% extends "base.html" %}

{% block title %}404 Not Found - Civic Complaint System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-5 rounded-3">
                <h1 class="display-3 fw-bold text-secondary">404</h1>
                <h3 class="fw-bold mb-3">Page Not Found</h3>
                <p class="text-secondary mb-4">
                    The requested page could not be located on the server.
                </p>
                <div>
                    <a href="{{ url_for('auth.index') }}" class="btn btn-primary px-4">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
